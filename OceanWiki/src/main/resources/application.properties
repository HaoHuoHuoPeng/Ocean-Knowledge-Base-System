# 文件说明：这个文件负责application对应模块的代码逻辑。
# 后端服务端口，前端通过 Vite 代理访问这个端口
server.port=8881

# 数据库连接地址，数据库需要先执行 src/main/resources/db/wiki.sql 创建
spring.datasource.url=jdbc:mysql://localhost:3306/oceanwiki?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true

# 本机 MySQL 账号密码从环境变量读取，避免把真实密码上传到 GitHub
# Windows 可以在 IDEA 运行配置里设置环境变量：DB_USERNAME=root;DB_PASSWORD=你的数据库密码
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MySQL 8 使用这个驱动类
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 的 XML 文件位置，resources/mapper 下面的 XML 会被扫描
mybatis-plus.mapper-locations=classpath:/mapper/*.xml

# 开启下划线字段到驼峰属性的自动映射，例如 category1_id -> category1Id
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 打印 mapper 层 SQL，学习时方便观察实际执行了哪些 SQL
logging.level.com.shiwangsi.oceanwiki.mapper=trace

# Knife4j 接口文档增强开关，启动后访问 http://127.0.0.1:8881/doc.html
knife4j.enable=true

# 本地上传封面图片的大小限制，和 UploadController 里的 5MB 校验保持一致
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
